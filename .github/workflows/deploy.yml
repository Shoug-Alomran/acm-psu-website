name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The public website is plain HTML and needs no build. The member and
      # admin portals are TypeScript, so they are rebuilt here from source
      # rather than trusting whatever bundle happens to be committed.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Type-check the portal
        run: npm run typecheck

      # PUBLIC_* values are safe in a browser: the Supabase anon key grants
      # nothing on its own because every table is protected by row level
      # security. Privileged keys live in Supabase Edge Function secrets and
      # never reach this workflow.
      - name: Build the portal bundles
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SITE_URL: https://acm-psu.shoug-tech.com
        run: npm run build

      # design-template/ holds the original mockups and is not published.
      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'design-template' \
            --exclude 'node_modules' \
            --exclude 'platform' \
            --exclude 'supabase' \
            --exclude 'docs' \
            --exclude 'tmp' \
            --exclude 'assets/reports/psu-ctf-competition-report.pdf' \
            --exclude 'assets/reports/psu-ctf-2-competition-report.pdf' \
            --exclude 'projects/ctf-2.0/psu-ctf-2.0-report.pdf' \
            --exclude 'projects/ctf-3.0/workshop-material' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'tsconfig.json' \
            --exclude 'build.mjs' \
            --exclude '.env.local.example' \
            --exclude '_site' \
            ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
