name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_SITE_URL: https://acm-psu.shoug-tech.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install build dependencies
        run: npm ci

      # The integrity audit verifies that every HTML script reference and every
      # platform/pages entry point has a generated bundle. Build first so a new
      # TypeScript page cannot fail simply because its generated JS was not
      # committed yet.
      - name: Build the portal bundles
        run: npm run build

      - name: Audit repository integrity
        run: npm run audit:repo

      - name: Type-check the portal
        run: npm run typecheck

      - name: Type-check Supabase Edge Functions
        run: |
          set -euo pipefail
          for entry in supabase/functions/*/index.ts; do
            echo "Checking $entry"
            deno check --node-modules-dir=auto "$entry"
          done

      - name: Validate public Supabase configuration
        shell: bash
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ]; then
            echo "::error::PUBLIC_SUPABASE_URL is missing from GitHub repository secrets."
            exit 1
          fi

          if [ -z "$PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::PUBLIC_SUPABASE_ANON_KEY is missing from GitHub repository secrets."
            exit 1
          fi

          echo "PUBLIC_SUPABASE_URL is configured."
          echo "PUBLIC_SUPABASE_ANON_KEY is configured."
          echo "Supabase URL length: ${#PUBLIC_SUPABASE_URL}"
          echo "Supabase key length: ${#PUBLIC_SUPABASE_ANON_KEY}"

      - name: Stage site files
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          # CTF archives and workshop materials are intentionally public. Only
          # source/build/operations files are excluded from the Pages artifact.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'design-template' \
            --exclude 'node_modules' \
            --exclude 'platform' \
            --exclude 'supabase' \
            --exclude 'docs' \
            --exclude 'tmp' \
            --exclude 'scripts' \
            --exclude 'apps-script' \
            --exclude 'README.md' \
            --exclude 'deno.lock' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'tsconfig.json' \
            --exclude 'build.mjs' \
            --exclude '.env.local' \
            --exclude '.env.local.example' \
            --exclude '_site' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
