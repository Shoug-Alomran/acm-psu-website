name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_SITE_URL: https://acm-psu.shoug-tech.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Type-check the portal
        run: npm run typecheck

      - name: Validate public Supabase configuration
        shell: bash
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ]; then
           echo "::error::PUBLIC_SUPABASE_URL is missing from GitHub repository secrets."
            exit 1
          fi

          if [ -z "$PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::PUBLIC_SUPABASE_ANON_KEY is missing from GitHub repository secrets."
            exit 1
          fi

          echo "PUBLIC_SUPABASE_URL is configured."
          echo "PUBLIC_SUPABASE_ANON_KEY is configured."
          echo "Supabase URL length: ${#PUBLIC_SUPABASE_URL}"
          echo "Supabase key length: ${#PUBLIC_SUPABASE_ANON_KEY}"

      - name: Build the portal bundles
        run: npm run build

      - name: Stage site files
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'design-template' \
            --exclude 'node_modules' \
            --exclude 'platform' \
            --exclude 'supabase' \
            --exclude 'docs' \
            --exclude 'tmp' \
            --exclude 'assets/reports/psu-ctf-competition-report.pdf' \
            --exclude 'assets/reports/psu-ctf-2-competition-report.pdf' \
            --exclude 'projects/ctf-2.0/psu-ctf-2.0-report.pdf' \
            --exclude 'projects/ctf-3.0/workshop-material' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'tsconfig.json' \
            --exclude 'build.mjs' \
            --exclude '.env.local' \
            --exclude '.env.local.example' \
            --exclude '_site' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
